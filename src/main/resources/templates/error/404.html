<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>404 페이지 없음 - First Portfolio</title>

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
        <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
        <link th:href="@{/css/bootstrap-icons.css}" rel="stylesheet">
        <link th:href="@{/css/templatemo-first-portfolio-style.css}" rel="stylesheet">

        <style>
            .auth-page { min-height: 100vh; background: linear-gradient(135deg, var(--primary-color) 0%, #3d4580 100%); padding: 48px 16px; }
            .auth-card { background: var(--white-color); border-radius: var(--border-radius-medium); box-shadow: 0 1rem 3rem rgba(0, 0, 0, .2); max-width: 480px; width: 100%; padding: 40px 36px; }
            .error-code { font-size: 64px; font-weight: var(--font-weight-bold); color: #f0a030; line-height: 1; }
            .auth-icon { width: 72px; height: 72px; line-height: 72px; border-radius: 50%; background: #f0a030; color: var(--white-color); font-size: 32px; text-align: center; }
            .custom-btn { border: 0; }
        </style>
    </head>

    <body>
        <main class="auth-page d-flex justify-content-center align-items-center">
            <div class="auth-card text-center">
                <div class="d-inline-block auth-icon mb-3"><i class="bi-search"></i></div>
                <div class="error-code mb-2">404</div>
                <h4 class="mb-2">찾는 페이지가 없습니다</h4>
                <p class="text-muted mb-4">
                    주소가 잘못되었거나, 이미 <strong>삭제된 글</strong>입니다.<br>
                    예) 없는 글 번호 <code>/board/99999</code>
                </p>

                <div class="alert alert-light border py-2 mb-4 text-start" th:if="${path}">
                    <div><i class="bi-link-45deg me-1"></i>요청 주소 : <code th:text="${path}">/board/99999</code></div>
                </div>

                <div class="d-flex gap-2">
                    <a th:href="@{/}" class="custom-btn btn flex-fill"><i class="bi-house me-1"></i>메인으로</a>
                    <a th:href="@{/board}" class="btn btn-outline-secondary flex-fill d-flex align-items-center justify-content-center"
                       style="border-radius: var(--border-radius-large);"><i class="bi-list me-1"></i>게시판</a>
                </div>
            </div>
        </main>
    </body>
</html>
